name: Sun Gateway tests
on:
  push:
    paths: ['gateway/**', 'app/src/main/assets/cinema/catalog.json', '.github/workflows/gateway.yml']
  pull_request:
    paths: ['gateway/**', 'app/src/main/assets/cinema/catalog.json', '.github/workflows/gateway.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s gateway -p 'test_*.py'
      - run: docker build -t sun-gateway -f gateway/Dockerfile .
