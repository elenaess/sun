name: Sun APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sun-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar o Sun
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar assinatura e preparar o APK
        id: apk
        run: |
          set -euo pipefail
          dir=app/build/outputs/apk/debug
          version=$(jq -er '.elements[0].versionName' "$dir/output-metadata.json")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          file="Sun-v${version}-debug.apk"
          cp "$dir/app-debug.apk" "$file"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$file"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Sun-v${{ steps.apk.outputs.version }}-APK
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sun-v${{ needs.build.outputs.version }}-APK
      - name: Publicar o primeiro APK de cada versão
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          file="Sun-$tag-debug.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              echo "O APK desta versão já está publicado."
            else
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Sun $tag para Android" --prerelease \
              --notes "Baixe o arquivo .apk para instalar o Sun no Android 8.0 ou superior. Versão de teste com assinatura de depuração."
          fi
