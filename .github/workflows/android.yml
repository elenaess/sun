name: Sun APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sun-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar o Sun
        run: gradle --no-daemon :app:assembleDebug
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          dns=$(awk '/^nameserver / && $2 ~ /^[0-9.]+$/ && $2 !~ /^127/ {print $2; exit}' /run/systemd/resolve/resolv.conf /etc/resolv.conf 2>/dev/null || true)
          echo "SUN_DNS=${dns:-1.1.1.1,8.8.8.8}" >> "$GITHUB_ENV"
      - name: Reproduzir um anime no Android
        continue-on-error: true # Falha externa de fonte não bloqueia distribuição do APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server ${{ env.SUN_DNS }}
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 tools/check-playback.py
      - name: Verificar assinatura e preparar o APK
        id: apk
        run: |
          set -euo pipefail
          dir=app/build/outputs/apk/debug
          version=$(jq -er '.elements[0].versionName' "$dir/output-metadata.json")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          file="Sun-v${version}-debug.apk"
          cp "$dir/app-debug.apk" "$file"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$file"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Sun-v${{ steps.apk.outputs.version }}-APK
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sun-v${{ needs.build.outputs.version }}-APK
      - name: Publicar o primeiro APK de cada versão
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          file="Sun-$tag-debug.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              echo "O APK desta versão já está publicado."
            else
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Sun $tag para Android" --prerelease \
              --notes "Baixe o arquivo .apk para instalar o Sun no Android 8.0 ou superior. Versão de teste com assinatura de depuração."
          fi
